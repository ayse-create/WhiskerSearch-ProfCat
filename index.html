
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhiskerSearch — Yeni Adres</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 210, 235, 0.7), transparent 28%),
                radial-gradient(circle at 85% 25%, rgba(205, 230, 255, 0.7), transparent 28%),
                radial-gradient(circle at 50% 100%, rgba(220, 255, 225, 0.7), transparent 30%),
                #fafafa;
            color: #252525;
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: min(720px, 94%);
            text-align: center;
            animation: pageIn 0.8s ease;
        }

        /* LOGO */

        .logo {
            width: 105px;
            height: 105px;
            object-fit: contain;
            margin-bottom: 12px;
            animation: logoIn 1s ease;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 43px);
            font-weight: 750;
            letter-spacing: -1px;
        }

        .description {
            max-width: 600px;
            margin: 13px auto 30px;
            font-size: 17px;
            line-height: 1.6;
            color: #626262;
        }

        /* BROWSER */

        .browser {
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.10),
                0 3px 10px rgba(0, 0, 0, 0.05);
            text-align: left;
        }

        .browser-top {
            height: 45px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: rgba(245, 245, 247, 0.95);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot:nth-child(1) {
            background: #ff6b6b;
        }

        .dot:nth-child(2) {
            background: #ffd166;
        }

        .dot:nth-child(3) {
            background: #65d98b;
        }

        .browser-content {
            padding: 16px;
        }

        .address-bar {
            height: 47px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-radius: 12px;
            background: #f1f3f5;
            border: 1px solid #e2e4e7;
            overflow: hidden;
            position: relative;
        }

        .lock {
            margin-right: 10px;
            font-size: 14px;
        }

        #addressText {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }

        /* İMLEÇ */

        .fake-cursor {
            position: fixed;
            left: -100px;
            top: -100px;
            width: 23px;
            height: 30px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition:
                left 1.4s cubic-bezier(.2,.8,.2,1),
                top 1.4s cubic-bezier(.2,.8,.2,1),
                opacity .3s ease;
        }

        .fake-cursor::before {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 20px solid #222;
            transform: rotate(-42deg);
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.3));
        }

        .fake-cursor.show {
            opacity: 1;
        }

        /* ÇÖP KUTUSU */

        .trash {
            width: 75px;
            height: 82px;
            margin: 22px auto 4px;
            position: relative;
            opacity: 0;
            transform: translateY(10px) scale(.8);
            transition: .5s ease;
        }

        .trash.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .trash-lid {
            position: absolute;
            top: 4px;
            left: 8px;
            width: 59px;
            height: 10px;
            border-radius: 5px;
            background: #ff8fab;
            transform-origin: right center;
        }

        .trash-body {
            position: absolute;
            top: 15px;
            left: 14px;
            width: 48px;
            height: 60px;
            border-radius: 7px 7px 12px 12px;
            background: #ffb3c6;
        }

        .trash-line {
            position: absolute;
            top: 27px;
            width: 4px;
            height: 37px;
            border-radius: 4px;
            background: rgba(255,255,255,.6);
        }

        .trash-line:nth-child(1) {
            left: 27px;
        }

        .trash-line:nth-child(2) {
            left: 39px;
        }

        .trash-line:nth-child(3) {
            left: 51px;
        }

        /* DURUM */

        .status {
            height: 30px;
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }

        /* BUTONLAR */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .button {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 12px;
            font-weight: 650;
            font-size: 15px;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .primary {
            background: #242424;
            color: white;
            box-shadow: 0 7px 18px rgba(0,0,0,.12);
        }

        .secondary {
            background: white;
            color: #242424;
            border: 1px solid #dedede;
            box-shadow: 0 5px 15px rgba(0,0,0,.06);
        }

        .small {
            margin-top: 18px;
            font-size: 12px;
            color: #999;
        }

        /* ANIMASYONLAR */

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: scale(.75) rotate(-5deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        @media (max-width: 600px) {

            .logo {
                width: 85px;
                height: 85px;
            }

            .description {
                font-size: 15px;
            }

            #addressText {
                font-size: 11px;
            }

            .trash {
                transform: scale(.85);
            }
        }
    </style>
</head>

<body>

<div class="page">

    <main class="container">

        <img
            src="images/1.png"
            alt="WhiskerSearch"
            class="logo"
        >

        <h1>WhiskerSearch taşındı!</h1>

        <p class="description">
            WhiskerSearch artık yeni adresinde.
            Güncel WhiskerSearch'e ve tüm WhiskerHub projelerine
            buradan ulaşabilirsin.
        </p>

        <div class="browser">

            <div class="browser-top">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="browser-content">

                <div class="address-bar">
                    <span class="lock">🔒</span>
                    <span id="addressText"></span>
                </div>

            </div>

        </div>

        <div class="trash" id="trash">

            <div class="trash-lid"></div>

            <div class="trash-body">
                <span class="trash-line"></span>
                <span class="trash-line"></span>
                <span class="trash-line"></span>
            </div>

        </div>

        <div class="status" id="status">
            Eski adres kontrol ediliyor...
        </div>

        <div class="buttons">

            <a
                class="button primary"
                href="https://ayse-create.github.io/WhiskerSearch"
            >
                WhiskerSearch'e Git
            </a>

            <a
                class="button secondary"
                href="https://ayse-create.github.io/WhiskerHub"
            >
                WhiskerHub
            </a>

        </div>

        <div class="small">
            WhiskerHub • WhiskerSearch
        </div>

    </main>

</div>

<!-- Sahte mouse imleci -->
<div class="fake-cursor" id="cursor"></div>


<script>

    const oldAddress =
        "ayse-create.github.io/WhiskerSearch-ProfCat";

    const newAddress =
        "ayse-create.github.io/WhiskerSearch";

    const addressText =
        document.getElementById("addressText");

    const cursor =
        document.getElementById("cursor");

    const trash =
        document.getElementById("trash");

    const status =
        document.getElementById("status");


    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }


    async function typeText(text, speed) {

        for (let i = 0; i < text.length; i++) {

            addressText.textContent += text[i];

            await wait(speed);
        }
    }


    async function eraseText(speed) {

        while (addressText.textContent.length > 0) {

            addressText.textContent =
                addressText.textContent.slice(0, -1);

            await wait(speed);
        }
    }


    async function startAnimation() {

        /*
         * 1 — Eski adres yazılıyor
         */

        status.textContent =
            "Eski WhiskerSearch adresi bulundu...";

        await typeText(oldAddress, 32);


        /*
         * 2 — Eski adres uzun süre ekranda kalıyor
         */

        status.textContent =
            "Bu adres artık kullanılmıyor.";

        await wait(3000);


        /*
         * 3 — İmleç ortaya çıkıyor
         */

        cursor.classList.add("show");

        status.textContent =
            "Eski adres kaldırılıyor...";

        await wait(600);


        /*
         * 4 — İmleç adres çubuğuna geliyor
         */

        const addressRect =
            document.querySelector(".address-bar")
            .getBoundingClientRect();

        cursor.style.left =
            (addressRect.right - 50) + "px";

        cursor.style.top =
            (addressRect.top + 8) + "px";

        await wait(1500);


        /*
         * 5 — Çöp kutusu beliriyor
         */

        trash.classList.add("show");

        await wait(500);


        /*
         * 6 — İmleç çöp kutusuna gidiyor
         */

        const trashRect =
            trash.getBoundingClientRect();

        cursor.style.left =
            (trashRect.left + 25) + "px";

        cursor.style.top =
            (trashRect.top + 15) + "px";

        await wait(1500);


        /*
         * 7 — Adres siliniyor
         */

        await eraseText(25);

        await wait(400);


        /*
         * 8 — Çöp kutusu kapanıyor
         */

        trash.classList.remove("show");

        await wait(500);


        /*
         * 9 — İmleç tekrar adres çubuğuna geliyor
         */

        cursor.style.left =
            (addressRect.left + 150) + "px";

        cursor.style.top =
            (addressRect.top + 8) + "px";

        await wait(1200);


        /*
         * 10 — Yeni adres yazılıyor
         */

        status.textContent =
            "Yeni WhiskerSearch adresi yazılıyor...";

        await typeText(newAddress, 55);


        /*
         * 11 — Tamamlandı
         */

        await wait(700);

        status.textContent =
            "✓ Güncel adres hazır";

        /*
         * İmleci kaldır
         */

        await wait(500);

        cursor.classList.remove("show");

    }


    startAnimation();

</script>

</body>
</html>
