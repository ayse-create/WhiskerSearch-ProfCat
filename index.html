<style>
:root{
  --coffee1:#f7f1e3;
  --coffee2:#efe6d6;
  --coffee3:#3b2f2f;
  --latte:#b08968;
}

/* 🧁 ARKA PLAN (krem) */
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg,#f7f1e3,#efe6d6,#e6d5c3);
  padding:24px;
}

/* 🤍 KART (beyaz) */
.card{
  width:min(520px,100%);
  background:#ffffff;
  padding:32px 24px;
  border-radius:28px;
  box-shadow:0 14px 35px rgba(0,0,0,.15);
  text-align:center;
}

/* 🐱 emoji */
.emoji{
  font-size:64px;
  animation:float 2.6s ease-in-out infinite;
  margin-bottom:10px;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}

/* ✍️ yazılar */
h1{margin:6px 0;font-size:26px;}
p{margin:6px 0 16px;color:#444;}

/* ☕ BAR (karamel) */
.bar{
  width:100%;
  height:10px;
  background:#efe0d1;
  border-radius:999px;
  overflow:hidden;
  margin:14px 0 8px;
}

.bar span{
  display:block;
  height:100%;
  width:0%;
  animation:load 3s linear forwards;
  background:linear-gradient(90deg,#d6a77a,#c49a6c);
}

@keyframes load{
  to{width:100%}
}

/* 🍫 BUTON */
a.button{
  display:inline-block;
  margin-top:10px;
  padding:12px 16px;
  border-radius:14px;
  background:#ffffff;
  color:#4b2e1e;
  text-decoration:none;
  font-weight:700;
  border:2px solid #e2cbb5;
  transition:0.2s;
}

a.button:hover{
  background:#f7f1e3;
  transform:scale(1.03);
}
</style>

<meta http-equiv="refresh" content="2; url=https://ayse-create.github.io/WhiskerSearch">

<main class="card">

  <div class="emoji">🐱</div>

  <div class="bar"><span></span></div>

  <a class="button" href="https://ayse-create.github.io/WhiskerSearch/">
    Hemen Git
  </a>

</main>

</body>
