```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhiskerSearch — Taşındı</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        .container {
            width: min(680px, 90%);
            text-align: center;
            animation: appear 0.8s ease;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 22px;
            animation: logoAppear 1s ease;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 700;
        }

        .description {
            margin: 0 auto 30px;
            max-width: 560px;
            font-size: 17px;

            color: #5f6368;
        }

        /* Sahte tarayıcı */
        .browser {
            width: 100%;
            background: white;

        .browser-top {
            height: 42px;

        .address-area {
            padding: 13px 15px;
            background: white;
        }

        .address-bar {
            height: 42px;
            border-radius: 9px;
            background: #f1f3f4;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 14px;
            color: #5f6368;
            overflow: hidden;
            white-space: nowrap;
        }

        .address-icon {
            margin-right: 10px;
            font-family: Arial, sans-serif;
            color: #777;
        }

        #addressText {
            overflow: hidden;
            text-overflow: clip;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 17px;
            background: #555;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        .status {
            min-height: 28px;
            font-size: 15px;
            color: #666;
            margin-bottom: 22px;
        }

        .check {
            display: inline-block;
            opacity: 0;
            transform: scale(0.5);
            transition: 0.4s ease;
        }

        .check.show {
            opacity: 1;
            transform: scale(1);
        }

        .button {
            display: inline-flex;

            justify-content: center;

<body>

    <main class="container">

        <img src="1.png" alt="WhiskerSearch" class="logo">

        <h1>WhiskerSearch taşındı!</h1>

        <p class="description">
            WhiskerSearch artık yeni adresinde.
            Güncel WhiskerSearch'e ve tüm WhiskerHub projelerine buradan ulaşabilirsin.
        </p>

        <div class="browser">

            <div class="browser-top">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="address-area">
                <div class="address-bar">
                    <span class="address-icon">🔒</span>
                    <span id="addressText"></span>
                    <span class="cursor"></span>
                </div>
            </div>

        </div>

        <div class="status">
            <span id="statusText">Yeni adres hazırlanıyor...</span>
            <span id="check" class="check"> ✓</span>
        </div>

        <a
            href="https://ayse-create.github.io/WhiskerSearch"
            class="button"
        >
            WhiskerSearch'e Git
        </a>

        <div class="small">
            WhiskerHub • WhiskerSearch
        </div>

    </main>

    <script>
        const oldAddress =
            "ayse-create.github.io/WhiskerSearch-ProfCat";

        const newAddress =
            "ayse-create.github.io/WhiskerSearch";

        const addressText = document.getElementById("addressText");
        const statusText = document.getElementById("statusText");
        const check = document.getElementById("check");

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function typeText(text, speed) {
            for (let i = 0; i < text.length; i++) {
                addressText.textContent += text[i];
                await wait(speed);
            }
        }

        async function eraseText(speed) {
            while (addressText.textContent.length > 0) {
                addressText.textContent =
                    addressText.textContent.slice(0, -1);

                await wait(speed);
            }
        }

        async function startAnimation() {

            // Eski adres
            await typeText(oldAddress, 25);

            await wait(900);

            // Eski adres siliniyor
            await eraseText(18);

            await wait(250);

            // Yeni adres yazılıyor
            await typeText(newAddress, 35);

            await wait(500);

            // Tamamlandı
            statusText.textContent = "Güncel adres hazır";
            check.classList.add("show");

            /*
             * Otomatik yönlendirme istersen aşağıdaki kısmı
             * aktif edebilirsin.
             *
             * Şimdilik kullanıcı butona basıyor.
             */

            // await wait(2500);
            // window.location.href =
            //     "https://ayse-create.github.io/WhiskerSearch";
        }

        startAnimation();
    </script>

</body>
</html>
